# Generate the Xcode project with:  xcodegen generate
# (install XcodeGen with:  brew install xcodegen)
name: DayCountdown
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Set your Apple team ID here (or pick it in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  DayCountdown:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Day Countdown
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: App/DayCountdown.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DayCountdown
    dependencies:
      - target: CountdownWidget
  CountdownWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Day Countdown
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CountdownWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DayCountdown.CountdownWidget
